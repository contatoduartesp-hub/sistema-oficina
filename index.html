<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão Oficina</title>
    <!-- Tailwind CSS para Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilação em tempo de execução -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const {
          Receipt, Wrench, LayoutDashboard, SearchCode, Package, Car, FileText,
          ShoppingCart, History, AlertTriangle, Search, Plus, Edit, Trash2, X,
          CheckCircle2, Printer, RefreshCw, UserCheck, Settings, Save, Building2,
          Users, LogOut, Lock, UserPlus
        } = lucide;

        const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxgw__EhDG03GxuOS4eQesAZCP_Jj0omheAxyfCFZfCndLAOWjmEs83o_tC1k1Gym73/exec';

        const DEFAULT_CONFIG = {
          nome_fantasia: 'AutoGestão Oficina',
          razao_social: 'Oficina Mecânica & Auto Peças Ltda',
          cnpj: '00.000.000/0001-00',
          telefone: '(11) 99999-9999',
          email: 'contato@oficina.com.br',
          endereco: 'Rua das Oficinas, 123 - Centro',
          cidade_uf: 'São Paulo - SP',
          mensagem_cupom: 'Obrigado pela preferência! Garantia de 90 dias nos serviços.',
          logo_url: ''
        };

        const INITIAL_DATA = {
          config: DEFAULT_CONFIG,
          cadastro: [], estoque: [], placas: [], funcionarios: [], orcamentos: [], saidas: [],
          usuarios: [{ id: 'admin-default', username: 'admin', password: '81158617', role: 'admin' }]
        };

        const formatarMoeda = (valor) => {
          const num = Number(valor);
          return isNaN(num) ? '0.00' : num.toFixed(2);
        };

        const gerarIdUnico = () => String(Date.now()) + Math.random().toString(36).substring(2, 5);
        const gerarIdCurto = () => String(Date.now()).slice(-5) + Math.floor(Math.random() * 10);

        function App() {
          const [activeTab, setActiveTab] = React.useState('dashboard');
          const [currentUser, setCurrentUser] = React.useState(null);
          const [scriptUrl, setScriptUrl] = React.useState(() => localStorage.getItem('oficina_script_url') || DEFAULT_WEB_APP_URL);
          const [db, setDb] = React.useState(INITIAL_DATA);
          const [loading, setLoading] = React.useState(true);
          const [syncing, setSyncing] = React.useState(false);
          const [syncError, setSyncError] = React.useState(null);
          const [toast, setToast] = React.useState(null);

          const [username, setUsername] = React.useState('');
          const [password, setPassword] = React.useState('');
          const [loginErro, setLoginErro] = React.useState('');

          // Estados dos Modais integrados
          const [modalPeca, setModalPeca] = React.useState({ open: false, item: null });
          const [buscaConsulta, setBuscaConsulta] = React.useState('');

          React.useEffect(() => {
            fetchFromSheets();
          }, []);

          const fetchFromSheets = async () => {
            setLoading(true);
            setSyncError(null);
            try {
              const response = await fetch(scriptUrl);
              const data = await response.json();
              if (data && (data.cadastro || data.orcamentos)) {
                setDb({
                  config: data.config || DEFAULT_CONFIG,
                  cadastro: data.cadastro || [],
                  estoque: data.estoque || [],
                  placas: data.placas || [],
                  funcionarios: data.funcionarios || [],
                  orcamentos: data.orcamentos || [],
                  saidas: data.saidas || [],
                  usuarios: data.usuarios || INITIAL_DATA.usuarios
                });
              }
            } catch (err) {
              setSyncError('Usando dados locais ou aguardando configuração de URL de Script.');
            } finally {
              setLoading(false);
            }
          };

          const syncToSheets = async (newDbState) => {
            setSyncing(true);
            try {
              await fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'save', db: newDbState })
              });
              setToast('Sincronizado com o Google Sheets!');
              setTimeout(() => setToast(null), 3000);
            } catch (err) {
              setSyncError('Erro na gravação remota.');
            } finally {
              setSyncing(false);
            }
          };

          const updateDatabase = (updaterFn) => {
            setDb(prev => {
              const updated = updaterFn(prev);
              syncToSheets(updated);
              return updated;
            });
          };

          const handleLogin = (e) => {
            e.preventDefault();
            if (username === 'admin' && password === '81158617') {
              setCurrentUser({ username: 'admin', role: 'admin' });
            } else {
              setLoginErro('Usuário ou senha incorretos.');
            }
          };

          if (loading) {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-slate-400 gap-3">
                <RefreshCw size={36} className="animate-spin text-amber-500" />
                <p className="font-medium text-sm">Carregando painel de gerenciamento estático...</p>
              </div>
            );
          }

          if (!currentUser) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6 sm:p-8">
                  <div className="flex flex-col items-center mb-6">
                    <div className="bg-amber-500 p-3 rounded-xl text-slate-950 mb-3 shadow-md"><Wrench size={32} /></div>
                    <h1 className="text-xl font-bold text-slate-900">AutoGestão Oficina</h1>
                    <p className="text-xs text-slate-400 mt-1">Hospedagem estática segura via GitHub Pages</p>
                  </div>
                  {loginErro && <div className="mb-4 p-3 bg-rose-50 text-rose-700 rounded-lg text-xs font-bold text-center border border-rose-200">{loginErro}</div>}
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Usuário</label>
                      <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-amber-500" placeholder="admin" required />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Senha</label>
                      <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••" required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 rounded-xl transition shadow">Acessar Sistema</button>
                  </form>
                </div>
              </div>
            );
          }

          const pecasComEstoque = db.cadastro.map(p => {
            const est = db.estoque.find(e => String(e.id_peca) === String(p.id));
            const q = est ? Number(est.qtd_atual) : 0;
            return { ...p, qtd_atual: q, status: q <= Number(p.min || 0) ? 'COMPRAR' : 'OK' };
          });

          return (
            <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row text-slate-800 font-sans">
              {toast && <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium border border-slate-700 animate-fade-in-up">● {toast}</div>}
              
              <aside className="w-full md:w-64 bg-slate-900 text-white p-5 flex flex-col justify-between shrink-0">
                <div>
                  <div className="flex items-center gap-3 border-b border-slate-800 pb-4 mb-4">
                    <div className="bg-amber-500 p-2 rounded-lg text-slate-950"><Wrench size={20}/></div>
                    <div>
                      <h2 className="font-bold text-sm leading-tight">{db.config?.nome_fantasia || 'AutoGestão'}</h2>
                      <p className="text-[10px] text-slate-400">Painel do Administrador</p>
                    </div>
                  </div>
                  <nav className="space-y-1">
                    <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}`}><LayoutDashboard size={16}/> Visão Geral</button>
                    <button onClick={() => setActiveTab('consulta')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold ${activeTab === 'consulta' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}`}><SearchCode size={16}/> Consulta Preços</button>
                    <button onClick={() => setActiveTab('cadastro')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold ${activeTab === 'cadastro' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}`}><Package size={16}/> Cadastro de Peças</button>
                  </nav>
                </div>
                <div className="border-t border-slate-800 pt-4 text-[11px] text-slate-400 space-y-2">
                  <div className="flex justify-between items-center">
                    <span>Nuvem Planilha:</span>
                    <span className={syncing ? 'text-amber-400 font-bold' : 'text-emerald-400 font-bold'}>{syncing ? 'Gravando...' : 'OK'}</span>
                  </div>
                  <button onClick={() => setCurrentUser(null)} className="w-full bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white py-1.5 rounded-lg font-bold transition">Desconectar</button>
                </div>
              </aside>

              <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">Painel Operacional</h2>
                      <p className="text-xs text-slate-400 mt-0.5">Visão unificada das métricas locais salvas em cache.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span className="text-[10px] uppercase font-bold text-slate-400">Total Peças</span>
                        <p className="text-2xl font-bold text-slate-800 mt-1">{db.cadastro.length} itens</p>
                      </div>
                      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span className="text-[10px] uppercase font-bold text-slate-400">Orçamentos gerados</span>
                        <p className="text-2xl font-bold text-slate-800 mt-1">{db.orcamentos.length} OS</p>
                      </div>
                      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span className="text-[10px] uppercase font-bold text-slate-400">Saídas Balcão</span>
                        <p className="text-2xl font-bold text-slate-800 mt-1">{db.saidas.length} vendas</p>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'consulta' && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">Consulta de Preço e Saldo</h2>
                      <p className="text-xs text-slate-400">Busca local instantânea por código interno ou descrição.</p>
                    </div>
                    <input type="text" placeholder="Pesquisar..." value={buscaConsulta} onChange={e=>setBuscaConsulta(e.target.value)} className="w-full p-2.5 border rounded-xl shadow-sm text-sm" />
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                      {pecasComEstoque.filter(p=>p.descricao.toLowerCase().includes(buscaConsulta.toLowerCase()) || p.codigo.toLowerCase().includes(buscaConsulta.toLowerCase())).map(p => (
                        <div key={p.id} className="bg-white p-4 rounded-xl border flex flex-col justify-between shadow-sm">
                          <div>
                            <span className="text-[10px] font-mono font-bold bg-slate-100 px-2 py-0.5 rounded text-slate-600">{p.codigo}</span>
                            <h4 className="font-bold text-sm text-slate-800 mt-2">{p.descricao}</h4>
                            <p className="text-xs text-slate-400 mt-1">Saldo atual: <b>{p.qtd_atual}</b> | Mín: {p.min}</p>
                          </div>
                          <div className="text-right font-extrabold text-amber-600 text-lg border-t pt-2 mt-3">R$ {formatarMoeda(p.venda)}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'cadastro' && (
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900">Listagem Geral do Cadastro</h2>
                        <p className="text-xs text-slate-400">Dados integrados diretamente com as abas da planilha externa.</p>
                      </div>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead><tr className="bg-slate-50 text-slate-500 uppercase border-b"><th className="p-3">Código</th><th className="p-3">Descrição</th><th className="p-3 text-right">Preço Venda</th><th className="p-3 text-center">Saldo</th></tr></thead>
                        <tbody className="divide-y">
                          {pecasComEstoque.map(p => (
                            <tr key={p.id} className="hover:bg-slate-50/80">
                              <td className="p-3 font-mono font-semibold text-slate-600">{p.codigo}</td>
                              <td className="p-3 font-medium text-slate-800">{p.descricao}</td>
                              <td className="p-3 text-right font-bold text-emerald-700">R$ {formatarMoeda(p.venda)}</td>
                              <td className="p-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${p.qtd_atual <= p.min ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}`}>{p.qtd_atual}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
